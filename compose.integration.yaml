name: ${COMPOSE_PROJECT_NAME:-galreview-integration}

services:
  user-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${USER_MYSQL_ROOT_PASSWORD:-user-root-dev-password}
      MYSQL_DATABASE: galreview_user
      MYSQL_USER: galreview_user
      MYSQL_PASSWORD: ${USER_MYSQL_PASSWORD:-user-dev-password}
    volumes:
      - user-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  auth-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_MYSQL_ROOT_PASSWORD:-auth-root-dev-password}
      MYSQL_DATABASE: galreview_auth
      MYSQL_USER: galreview_auth
      MYSQL_PASSWORD: ${AUTH_MYSQL_PASSWORD:-auth-dev-password}
    volumes:
      - auth-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  credit-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${CREDIT_MYSQL_ROOT_PASSWORD:-credit-root-dev-password}
      MYSQL_DATABASE: qzwl_credit
      MYSQL_USER: qzwl_credit
      MYSQL_PASSWORD: ${CREDIT_MYSQL_PASSWORD:-credit-dev-password}
    volumes:
      - credit-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    volumes:
      - file-mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand('ping').ok
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  neo4j:
    image: neo4j:2026.06.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-knowledge-dev-password}
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD:-knowledge-dev-password}
    ports:
      - "${DIAGNOSTIC_BIND_ADDRESS:-127.0.0.1}:${NEO4J_BROWSER_HOST_PORT:-5254}:7474"
      - "${DIAGNOSTIC_BIND_ADDRESS:-127.0.0.1}:${NEO4J_BOLT_HOST_PORT:-5255}:7687"
    volumes:
      - knowledge-neo4j-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -a bolt://127.0.0.1:7687 -u neo4j -p "$${HEALTHCHECK_PASSWORD}"
          "RETURN 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  user-service:
    build:
      context: ./backend/UserService
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5101
      MOONSTONE_MODE: ${USER_SERVICE_MODE:-Mock}
      Gateway__ServiceKey: ${USER_SERVICE_KEY:-moonstone-local-gateway-key}
      ConnectionStrings__UserDatabase: "Server=user-mysql;Port=3306;Database=galreview_user;User ID=galreview_user;Password=${USER_MYSQL_PASSWORD:-user-dev-password};SslMode=Disabled;AllowPublicKeyRetrieval=True"
    depends_on:
      user-mysql:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build:
      context: ./backend/AuthService
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5102
      MOONSTONE_MODE: ${AUTH_SERVICE_MODE:-Mock}
      Gateway__BaseUrl: http://gateway:5000
      Gateway__ServiceKey: ${AUTH_SERVICE_KEY:-moonstone-local-gateway-key}
      Admin__Username: ${GALREVIEW_ADMIN_USERNAME:-integration-admin}
      Admin__Password: ${GALREVIEW_ADMIN_PASSWORD:-integration-admin-password}
      Email__SmtpHost: ${SMTP_HOST:-}
      Email__SmtpPort: ${SMTP_PORT:-465}
      Email__UseSsl: ${SMTP_USE_SSL:-true}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Email__FromName: ${SMTP_FROM_NAME:-GalReview}
      AccountFrontend__BaseUrl: ${ACCOUNT_FRONTEND_BASE_URL:-http://localhost:5120}
      ConnectionStrings__AuthDatabase: "Server=auth-mysql;Port=3306;Database=galreview_auth;User ID=galreview_auth;Password=${AUTH_MYSQL_PASSWORD:-auth-dev-password};SslMode=Disabled;AllowPublicKeyRetrieval=True"
    depends_on:
      auth-mysql:
        condition: service_healthy
      user-service:
        condition: service_healthy
      credit-service:
        condition: service_healthy
    restart: unless-stopped

  credit-service:
    build:
      context: ./backend/CreditService
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5108
      Gateway__ServiceKey: ${CREDIT_SERVICE_KEY:-moonstone-local-gateway-key}
      ConnectionStrings__CreditDatabase: "Server=credit-mysql;Port=3306;Database=qzwl_credit;User ID=qzwl_credit;Password=${CREDIT_MYSQL_PASSWORD:-credit-dev-password};SslMode=Disabled;AllowPublicKeyRetrieval=True"
      CreditStore__Provider: MySQL
    depends_on:
      credit-mysql:
        condition: service_healthy
    restart: unless-stopped

  file-service:
    build:
      context: ./backend/FileService
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5103
      Gateway__ServiceKey: ${FILE_SERVICE_KEY:-moonstone-local-gateway-key}
      ConnectionStrings__FileDatabase: mongodb://mongo:27017/qzwl_file
      MongoDb__Database: qzwl_file
      InternalAccess__ExtractedTextAllowedServices__0: KnowledgeService
      InternalAccess__ExtractedTextAllowedServices__1: PracticeService
      Ocr__BaseUrl: http://ocr-service:5110/
      Ocr__TimeoutMinutes: 20
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  knowledge-service:
    build:
      context: ./backend/KnowledgeService
      dockerfile: KnowledgeService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Neo4j__Uri: bolt://neo4j:7687
      Neo4j__Username: neo4j
      Neo4j__Password: ${NEO4J_PASSWORD:-knowledge-dev-password}
      Neo4j__Database: neo4j
      GatewayMaterialText__BaseUrl: http://gateway:5000
      GatewayMaterialText__ServiceName: KnowledgeService
      GatewayMaterialText__ServiceKey: ${KNOWLEDGE_SERVICE_KEY:-moonstone-local-gateway-key}
      Gateway__ServiceKey: ${KNOWLEDGE_SERVICE_KEY:-moonstone-local-gateway-key}
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "${DIAGNOSTIC_BIND_ADDRESS:-127.0.0.1}:${KNOWLEDGE_HOST_PORT:-5104}:8080"
    restart: unless-stopped

  galgame-service:
    build:
      context: ./backend/GalGameService
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5105
      Gateway__BaseUrl: http://gateway:5000
      Gateway__ServiceKey: ${GALGAME_SERVICE_KEY:-moonstone-local-gateway-key}
      InternalAccess__ValidationAllowedServices__0: RenderService
      InternalAccess__PackageReaderAllowedServices__0: RenderService
      ConnectionStrings__GameDatabase: mongodb://mongo:27017
      MongoDb__Database: qzwl_galgame
      GalGameStore__Provider: MongoDB
      NarrativeGeneration__Enabled: ${GALGAME_NARRATIVE_ENABLED:-true}
      NarrativeGeneration__ApiKey: ${DSAPI:-}
      NarrativeGeneration__Endpoint: ${GALGAME_NARRATIVE_ENDPOINT:-https://api.deepseek.com/chat/completions}
      NarrativeGeneration__Model: ${GALGAME_NARRATIVE_MODEL:-deepseek-v4-pro}
      NarrativeGeneration__PromptVersion: galgame-narrative-v3
      VoiceSynthesis__Enabled: ${GALGAME_VOICE_ENABLED:-true}
      VoiceSynthesis__ApiKey: ${MIMO_API_KEY:-}
      VoiceSynthesis__Endpoint: ${MIMO_TTS_ENDPOINT:-https://api.xiaomimimo.com/v1/chat/completions}
      VoiceSynthesis__Model: mimo-v2.5-tts
      VoiceSynthesis__MaxConcurrency: ${MIMO_TTS_MAX_CONCURRENCY:-2}
    depends_on:
      knowledge-service:
        condition: service_healthy
      mongo:
        condition: service_healthy
      credit-service:
        condition: service_healthy
    restart: unless-stopped

  render-service:
    build:
      context: ./backend/RenderService
    environment:
      PORT: 5106
      Gateway__BaseUrl: http://gateway:5000
      Gateway__ServiceName: RenderService
      Gateway__ServiceKey: ${RENDER_SERVICE_KEY:-moonstone-local-gateway-key}
    restart: unless-stopped

  practice-service:
    build:
      context: ./backend/PracticeService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5107
      Gateway__BaseUrl: http://gateway:5000
      Gateway__ServiceName: PracticeService
      Gateway__ServiceKey: ${PRACTICE_SERVICE_KEY:-moonstone-local-gateway-key}
      ConnectionStrings__PracticeDatabase: mongodb://mongo:27017
      MongoDb__Database: qzwl_practice
      PracticeStore__Provider: MongoDB
      QuestionGeneration__ApiKey: ${DSAPI:-}
      QuestionGeneration__Endpoint: ${PRACTICE_QUESTION_ENDPOINT:-https://api.deepseek.com/chat/completions}
      QuestionGeneration__Model: ${PRACTICE_QUESTION_MODEL:-deepseek-v4-flash}
      QuestionGeneration__Parallelism: ${PRACTICE_QUESTION_PARALLELISM:-4}
    depends_on:
      mongo:
        condition: service_healthy
      knowledge-service:
        condition: service_started
      credit-service:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 5000
      GATEWAY_KEY: ${GATEWAY_KEY:-moonstone-local-gateway-key}
      USER_SERVICE_KEY: ${USER_SERVICE_KEY:-moonstone-local-gateway-key}
      AUTH_SERVICE_KEY: ${AUTH_SERVICE_KEY:-moonstone-local-gateway-key}
      FILE_SERVICE_KEY: ${FILE_SERVICE_KEY:-moonstone-local-gateway-key}
      KNOWLEDGE_SERVICE_KEY: ${KNOWLEDGE_SERVICE_KEY:-moonstone-local-gateway-key}
      GALGAME_SERVICE_KEY: ${GALGAME_SERVICE_KEY:-moonstone-local-gateway-key}
      RENDER_SERVICE_KEY: ${RENDER_SERVICE_KEY:-moonstone-local-gateway-key}
      PRACTICE_SERVICE_KEY: ${PRACTICE_SERVICE_KEY:-moonstone-local-gateway-key}
      CREDIT_SERVICE_KEY: ${CREDIT_SERVICE_KEY:-moonstone-local-gateway-key}
      USER_SERVICE_URL: http://user-service:5101
      AUTH_SERVICE_URL: http://auth-service:5102
      FILE_SERVICE_URL: http://file-service:5103
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:8080
      GALGAME_SERVICE_URL: http://galgame-service:5105
      RENDER_SERVICE_URL: http://render-service:5106
      PRACTICE_SERVICE_URL: http://practice-service:5107
      CREDIT_SERVICE_URL: http://credit-service:5108
      READINESS_SERVICES: userService,authService,fileService,knowledgeService,galGameService,renderService,practiceService,creditService
      DEFAULT_TIMEOUT_MS: 30000
      UPLOAD_TIMEOUT_MS: 120000
      # 未设置时不采信 X-Forwarded-For（匿名限流按 socket 对端计量）。网关端口
      # 若只经可信反代对外，可设为该代理的地址/网段，例如 TRUST_PROXY=172.18.0.0/16
      TRUST_PROXY: ${TRUST_PROXY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5120,http://localhost:5121,http://localhost:5122}
    depends_on:
      user-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
      galgame-service:
        condition: service_healthy
      render-service:
        condition: service_healthy
      practice-service:
        condition: service_healthy
      credit-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_BIND_ADDRESS:-0.0.0.0}:${GATEWAY_HOST_PORT:-5000}:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      GATEWAY_UPSTREAM: http://gateway:5000
      PORT: 8080
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_HOST_PORT:-5120}:8080"
    restart: unless-stopped

  ocr-service:
    profiles:
      - ocr
    build:
      context: ./backend/OCRService
    restart: unless-stopped

volumes:
  user-mysql-data:
  auth-mysql-data:
  credit-mysql-data:
  file-mongo-data:
  knowledge-neo4j-data:
