name: CI

# 千知万理 GalReview — 最小可用 CI
# 覆盖：.NET 服务（Auth/User/File/GalGame/Knowledge）构建与测试、gateway 构建与测试、
#       RenderService 构建与测试、OCRService 语法校验、frontend lint 与测试
# 触发：main 分支推送 + 指向 main 的 PR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同一分支新运行自动取消旧运行，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published-port-policy:
    name: Published host port policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep host-published ports inside the firewall range
        shell: pwsh
        run: ./scripts/Test-PortPolicy.ps1

  dotnet:
    name: .NET services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 项目混合 net8.0（Auth/User/File）与 net10.0（GalGame/Knowledge）
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # FileService 无测试项目，单独构建以验证可编译
      - name: Build FileService (no tests)
        run: dotnet build backend/FileService/GalGame.FileService.csproj --nologo

      # 四个测试项目各自 restore+build+test
      - name: Test AuthService
        run: dotnet test backend/AuthService/Tests/GalGame.AuthService.Tests.csproj --nologo

      - name: Test UserService
        run: dotnet test backend/UserService/Tests/GalGame.UserService.Tests.csproj --nologo

      - name: Test GalGameService
        run: dotnet test backend/GalGameService/Tests/GalGame.GalGameService.Tests.csproj --nologo

      - name: Test KnowledgeService
        run: dotnet test backend/KnowledgeService/KnowledgeService.Tests/KnowledgeService.Tests.csproj --nologo

  gateway:
    name: Gateway (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsc 类型检查 + 产物构建
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  render-service:
    name: RenderService (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/RenderService/service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/RenderService/service/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsc 类型检查 + 产物构建
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  ocr-service:
    name: OCRService (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/OCRService
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/OCRService/requirements.txt

      # PaddleOCR/PaddlePaddle 体积大且依赖较重，CI 中只校验应用层语法。
      # 单独安装 fastapi（轻量）后用 py_compile 校验 app.py 与 verify 脚本。
      - name: Install lightweight lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn python-multipart

      - name: Compile-check app modules
        run: |
          python -m py_compile app.py verify.py verify_fileservice.py

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
