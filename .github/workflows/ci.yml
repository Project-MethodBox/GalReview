name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published-port-policy:
    name: Published host port policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep host-published ports inside the firewall range
        shell: pwsh
        run: ./scripts/Test-PortPolicy.ps1

  dotnet:
    name: .NET services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build FileService (no tests)
        run: dotnet build backend/FileService/GalGame.FileService.csproj --nologo

      - name: Test AuthService
        run: dotnet test backend/AuthService/Tests/GalGame.AuthService.Tests.csproj --nologo

      - name: Test UserService
        run: dotnet test backend/UserService/Tests/GalGame.UserService.Tests.csproj --nologo

      - name: Test GalGameService
        run: dotnet test backend/GalGameService/Tests/GalGame.GalGameService.Tests.csproj --nologo

      - name: Test PracticeService
        run: dotnet test backend/PracticeService/PracticeService.Tests/PracticeService.Tests.csproj --nologo --configuration Release

      - name: Test CreditService
        run: dotnet test backend/CreditService/CreditService.Tests/CreditService.Tests.csproj --nologo --configuration Release

      - name: Test RenderService
        run: |
          cd backend/RenderService/service
          npm ci
          npm test
        working-directory: backend/RenderService/service

      - name: Test KnowledgeService
        run: dotnet test backend/KnowledgeService/KnowledgeService.Tests/KnowledgeService.Tests.csproj --nologo

  gateway:
    name: Gateway (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
