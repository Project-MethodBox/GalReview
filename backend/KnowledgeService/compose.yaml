name: galreview-knowledge

services:
  neo4j:
    image: neo4j:2026.06.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-knowledge-dev-password}
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD:-knowledge-dev-password}
      NEO4J_server_http_listen__address: :5254
      NEO4J_server_http_advertised__address: :5254
      NEO4J_server_bolt_listen__address: :5255
      NEO4J_server_bolt_advertised__address: :5255
    ports:
      - "5254:5254"
      - "5255:5255"
    volumes:
      - knowledge-neo4j-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -a bolt://localhost:5255 -u neo4j -p "$${HEALTHCHECK_PASSWORD}"
          "RETURN 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  knowledge-service:
    build:
      context: .
      dockerfile: KnowledgeService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5104
      Neo4j__Uri: bolt://neo4j:5255
      Neo4j__Username: neo4j
      Neo4j__Password: ${NEO4J_PASSWORD:-knowledge-dev-password}
      Neo4j__Database: neo4j
      GatewayMaterialText__BaseUrl: ${GATEWAY_BASE_URL:-http://host.docker.internal:5000}
      GatewayMaterialText__ServiceName: KnowledgeService
      GatewayMaterialText__ServiceKey: ${KNOWLEDGE_SERVICE_KEY:-moonstone-local-gateway-key}
      Gateway__ServiceKey: ${KNOWLEDGE_SERVICE_KEY:-moonstone-local-gateway-key}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "5104:5104"
    restart: unless-stopped

volumes:
  knowledge-neo4j-data:
